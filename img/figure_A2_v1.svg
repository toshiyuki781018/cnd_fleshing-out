<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cloud Native テキスト　図版 A-2　v1
  タイトル：見えているのに分からない状態
  サブタイトル：情報はある ─ しかし流れが見えない
  掲載箇所：序章（A-1の直後）
  作成日：2026-06-08
  キャンバス：1120 × 740 px（A4横相当）
  デザインガイド：左右比較テンプレート（A-4/A-5/A-6準拠）
  左：State Teal（一元把握=正の状態）  右：Infra Gray（情報はあるが霧がかかった状態）
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1120 740"
     width="1120" height="740"
     font-family="'Noto Sans JP', 'Hiragino Sans', 'Meiryo', sans-serif">

  <!-- ===== DEFS ===== -->
  <defs>
    <!-- リクエストフロー矢印 (オレンジ) -->
    <marker id="arr-flow" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D84315"/>
    </marker>
    <!-- ログ出力矢印 (ライトグレー) -->
    <marker id="arr-emit" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#B0BEC5"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════
       BACKGROUND
  ═══════════════════════════════════════ -->
  <rect width="1120" height="740" fill="#F5F7FA"/>

  <!-- ═══════════════════════════════════════
       TITLE BAR
  ═══════════════════════════════════════ -->
  <rect x="0" y="0" width="1120" height="54" fill="#1F4E79"/>
  <text x="560" y="22" text-anchor="middle" font-size="11" fill="#90CAF9"
        letter-spacing="2">Cloud Native テキスト　序章</text>
  <text x="560" y="44" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#FFFFFF">A-2　見えているのに分からない状態</text>

  <!-- ═══════════════════════════════════════
       LEFT PANEL ─ モノリス（一元把握できる）
       x=20–468, y=66–640
  ═══════════════════════════════════════ -->
  <!-- ヘッダー (State Teal = 全体が見えている正の状態) -->
  <rect x="20" y="66" width="448" height="40" fill="#00796B" rx="4"/>
  <text x="244" y="82" text-anchor="middle" font-size="10" fill="#E0F2F1">
    ① モノリス
  </text>
  <text x="244" y="99" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#FFFFFF">一箇所でログ・状態・処理フローを把握できる</text>

  <!-- パネル本体 -->
  <rect x="20" y="106" width="448" height="534" fill="#E0F2F1" stroke="#00796B"
        stroke-width="1.5"/>

  <!-- アプリケーション大枠 -->
  <rect x="42" y="122" width="404" height="432" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="2" rx="6"/>
  <text x="244" y="140" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#1F4E79">アプリケーション（モノリス）</text>
  <line x1="52" y1="152" x2="436" y2="152" stroke="#2E75B6" stroke-width="1"
        stroke-dasharray="4,3"/>

  <!-- 統合ログストリーム -->
  <text x="244" y="169" text-anchor="middle" font-size="10" fill="#546E7A">
    統合ログストリーム ─ 全処理を一箇所で記録
  </text>
  <rect x="62" y="176" width="362" height="148" fill="#FFFFFF" stroke="#00796B"
        stroke-width="1.5" rx="3"/>

  <!-- ログバー 1: 受付 -->
  <rect x="72" y="188" width="342" height="16" fill="#E0F2F1" stroke="#00796B"
        stroke-width="0.5" rx="2"/>
  <text x="80" y="200" text-anchor="start" font-size="8.5" fill="#004D40"
        font-family="'Courier New', Courier, monospace">
    10:23:14.001 [受付]  POST /api/orders  完了
  </text>

  <!-- ログバー 2: 認証 -->
  <rect x="72" y="210" width="342" height="16" fill="#FFF3E0" stroke="#D84315"
        stroke-width="0.5" rx="2"/>
  <text x="80" y="222" text-anchor="start" font-size="8.5" fill="#BF360C"
        font-family="'Courier New', Courier, monospace">
    10:23:14.012 [認証]  user=42 → 認証 OK
  </text>

  <!-- ログバー 3: DB -->
  <rect x="72" y="232" width="342" height="16" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="0.5" rx="2"/>
  <text x="80" y="244" text-anchor="start" font-size="8.5" fill="#1F4E79"
        font-family="'Courier New', Courier, monospace">
    10:23:14.023 [DB]    クエリ実行  rows=5
  </text>

  <!-- ログバー 4: 完了 -->
  <rect x="72" y="254" width="342" height="16" fill="#E0F2F1" stroke="#00796B"
        stroke-width="0.5" rx="2"/>
  <text x="80" y="266" text-anchor="start" font-size="8.5" fill="#004D40"
        font-family="'Courier New', Courier, monospace">
    10:23:14.030 [完了]  レスポンス 200 OK  45ms
  </text>

  <!-- ログ内注記 -->
  <text x="243" y="293" text-anchor="middle" font-size="9" fill="#00796B">
    ─ 1リクエストの全処理を順番に追える ─
  </text>
  <text x="243" y="309" text-anchor="middle" font-size="9" font-weight="bold"
        fill="#00796B">どこで何が起きたかを一目で確認できる</text>

  <!-- メトリクス（一括） -->
  <text x="244" y="342" text-anchor="middle" font-size="10" fill="#546E7A">
    メトリクス（全サービス一括）
  </text>
  <rect x="62" y="350" width="362" height="44" fill="#ECEFF1" stroke="#546E7A"
        stroke-width="1.5" rx="3"/>
  <text x="244" y="368" text-anchor="middle" font-size="9" fill="#546E7A">
    レスポンスタイム: 45ms  |  エラー率: 0.1%
  </text>
  <text x="244" y="385" text-anchor="middle" font-size="9" fill="#546E7A">
    リクエスト数: 1,024/min  |  CPU: 42%
  </text>

  <!-- ✓ 可視性バッジ -->
  <rect x="62" y="408" width="362" height="48" fill="#E0F2F1" stroke="#00796B"
        stroke-width="2" rx="5"/>
  <text x="243" y="427" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#00796B">✓  処理の流れをログで一貫して追える</text>
  <text x="243" y="446" text-anchor="middle" font-size="10" fill="#004D40">
    全ステップが一つのストリームに集まる
  </text>

  <!-- 左パネル下部注記 -->
  <text x="244" y="576" text-anchor="middle" font-size="10" fill="#546E7A">
    ログを見れば障害箇所を特定できる
  </text>

  <!-- ═══════════════════════════════════════
       CENTER PANEL ─ 情報はある vs 流れが見えない
       x=468–668, y=66–640
  ═══════════════════════════════════════ -->
  <rect x="468" y="106" width="200" height="534" fill="#F5F7FA"/>

  <!-- 情報はある（正） -->
  <rect x="478" y="168" width="180" height="88" fill="#E0F2F1" stroke="#00796B"
        stroke-width="1.5" rx="4"/>
  <text x="568" y="188" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#00796B">✓ 情報はある</text>
  <text x="568" y="208" text-anchor="middle" font-size="10" fill="#004D40">
    各サービスのログ・
  </text>
  <text x="568" y="224" text-anchor="middle" font-size="10" fill="#004D40">
    メトリクスは取得できる
  </text>
  <text x="568" y="242" text-anchor="middle" font-size="9" fill="#546E7A">
    （各サービス独立）
  </text>

  <!-- "しかし" 区切り -->
  <line x1="488" y1="274" x2="648" y2="274" stroke="#D84315" stroke-width="1.5"/>
  <text x="568" y="271" text-anchor="middle" font-size="14" font-weight="bold"
        fill="#D84315">しかし</text>

  <!-- 流れが見えない（負） -->
  <rect x="478" y="284" width="180" height="88" fill="#ECEFF1" stroke="#546E7A"
        stroke-width="1.5" rx="4"/>
  <text x="568" y="304" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#546E7A">✗ 流れが見えない</text>
  <text x="568" y="323" text-anchor="middle" font-size="10" fill="#546E7A">
    全体の処理を
  </text>
  <text x="568" y="339" text-anchor="middle" font-size="10" fill="#546E7A">
    一貫して追えない
  </text>
  <text x="568" y="357" text-anchor="middle" font-size="9" fill="#B0BEC5">
    （相関情報がない）
  </text>

  <!-- キーインサイトボックス -->
  <rect x="478" y="390" width="180" height="58" fill="#FFF3E0" stroke="#D84315"
        stroke-width="1.5" rx="4"/>
  <text x="568" y="409" text-anchor="middle" font-size="10" fill="#D84315">
    情報の存在 ≠
  </text>
  <text x="568" y="428" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#D84315">全体の理解</text>
  <text x="568" y="443" text-anchor="middle" font-size="8.5" fill="#BF360C">
    （これが観測可能性の核心）
  </text>

  <!-- A-3 導線ボックス -->
  <rect x="478" y="462" width="180" height="46" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="1.5" rx="4"/>
  <text x="568" y="481" text-anchor="middle" font-size="10" fill="#2E75B6">
    Observability で解決する
  </text>
  <text x="568" y="498" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#2E75B6">（→ A-3 へ）</text>

  <!-- パネル縦区切り -->
  <line x1="468" y1="106" x2="468" y2="640" stroke="#B0BEC5" stroke-width="1"
        stroke-dasharray="4,4"/>
  <line x1="668" y1="106" x2="668" y2="640" stroke="#B0BEC5" stroke-width="1"
        stroke-dasharray="4,4"/>

  <!-- ═══════════════════════════════════════
       RIGHT PANEL ─ 分散システム（情報はあるが流れが見えない）
       x=668–1100, y=66–640
  ═══════════════════════════════════════ -->
  <!-- ヘッダー (Infra Gray = 霧がかかった・不明瞭な状態) -->
  <rect x="668" y="66" width="432" height="40" fill="#546E7A" rx="4"/>
  <text x="884" y="82" text-anchor="middle" font-size="10" fill="#CFD8DC">
    ② 分散システム
  </text>
  <text x="884" y="99" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#FFFFFF">情報はあるが ─ 流れが見えない</text>

  <!-- パネル本体 -->
  <rect x="668" y="106" width="432" height="534" fill="#ECEFF1" stroke="#546E7A"
        stroke-width="1.5"/>

  <!-- ゾーンA ラベル -->
  <text x="884" y="120" text-anchor="middle" font-size="9" fill="#546E7A">
    リクエストは3つのサービスを経由する（リクエストフロー）
  </text>

  <!-- ── サービスボックス（横並び）── -->

  <!-- API サービス -->
  <rect x="688" y="126" width="116" height="62" fill="#F5F7FA" stroke="#2E75B6"
        stroke-width="1.5" rx="4"/>
  <text x="746" y="146" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#1F4E79">API サービス</text>
  <text x="746" y="162" text-anchor="middle" font-size="8.5" fill="#546E7A">
    ログ出力中
  </text>
  <text x="746" y="176" text-anchor="middle" font-size="8.5" fill="#546E7A">
    メトリクス収集中
  </text>

  <!-- リクエスト矢印 API→認証 -->
  <line x1="806" y1="157" x2="824" y2="157" stroke="#D84315" stroke-width="2"
        marker-end="url(#arr-flow)"/>

  <!-- 認証サービス -->
  <rect x="828" y="126" width="116" height="62" fill="#F5F7FA" stroke="#2E75B6"
        stroke-width="1.5" rx="4"/>
  <text x="886" y="146" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#1F4E79">認証サービス</text>
  <text x="886" y="162" text-anchor="middle" font-size="8.5" fill="#546E7A">
    ログ出力中
  </text>
  <text x="886" y="176" text-anchor="middle" font-size="8.5" fill="#546E7A">
    メトリクス収集中
  </text>

  <!-- リクエスト矢印 認証→データ -->
  <line x1="946" y1="157" x2="962" y2="157" stroke="#D84315" stroke-width="2"
        marker-end="url(#arr-flow)"/>

  <!-- データサービス -->
  <rect x="964" y="126" width="116" height="62" fill="#F5F7FA" stroke="#2E75B6"
        stroke-width="1.5" rx="4"/>
  <text x="1022" y="146" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#1F4E79">データサービス</text>
  <text x="1022" y="162" text-anchor="middle" font-size="8.5" fill="#546E7A">
    ログ出力中
  </text>
  <text x="1022" y="176" text-anchor="middle" font-size="8.5" fill="#546E7A">
    メトリクス収集中
  </text>

  <!-- ログ出力矢印（サービス → ログボックスへ、灰色点線） -->
  <line x1="746" y1="190" x2="746" y2="218" stroke="#B0BEC5" stroke-width="1.5"
        stroke-dasharray="3,2" marker-end="url(#arr-emit)"/>
  <line x1="886" y1="190" x2="886" y2="218" stroke="#B0BEC5" stroke-width="1.5"
        stroke-dasharray="3,2" marker-end="url(#arr-emit)"/>
  <line x1="1022" y1="190" x2="1022" y2="218" stroke="#B0BEC5" stroke-width="1.5"
        stroke-dasharray="3,2" marker-end="url(#arr-emit)"/>

  <!-- ログ出力ゾーン ラベル -->
  <text x="884" y="213" text-anchor="middle" font-size="9" fill="#546E7A">
    ログ / メトリクス出力（各サービス独立）
  </text>

  <!-- ログボックス括弧（点線） -->
  <rect x="684" y="220" width="396" height="100" fill="none" stroke="#546E7A"
        stroke-width="1" stroke-dasharray="5,4" rx="3"/>

  <!-- ── API サービス ログボックス ── -->
  <rect x="688" y="224" width="116" height="92" fill="#FFFFFF" stroke="#546E7A"
        stroke-width="1" rx="3"/>
  <!-- ヘッダー帯 -->
  <rect x="688" y="224" width="116" height="18" fill="#546E7A" rx="3"/>
  <text x="746" y="237" text-anchor="middle" font-size="8.5" font-weight="bold"
        fill="#FFFFFF">API ログ / Metrics</text>
  <!-- ログバー（スキマティック） -->
  <rect x="694" y="249" width="100" height="8" fill="#CFD8DC" rx="1"/>
  <rect x="694" y="262" width="84" height="8" fill="#CFD8DC" rx="1"/>
  <rect x="694" y="275" width="92" height="8" fill="#CFD8DC" rx="1"/>
  <!-- 相関IDなしバッジ -->
  <rect x="694" y="290" width="104" height="16" fill="#FFEBEE" stroke="#C62828"
        stroke-width="0.5" rx="2"/>
  <text x="746" y="301" text-anchor="middle" font-size="7.5" fill="#C62828">
    ？ request_id なし
  </text>

  <!-- ── 認証サービス ログボックス ── -->
  <rect x="828" y="224" width="116" height="92" fill="#FFFFFF" stroke="#546E7A"
        stroke-width="1" rx="3"/>
  <rect x="828" y="224" width="116" height="18" fill="#546E7A" rx="3"/>
  <text x="886" y="237" text-anchor="middle" font-size="8.5" font-weight="bold"
        fill="#FFFFFF">認証 ログ / Metrics</text>
  <rect x="834" y="249" width="96" height="8" fill="#CFD8DC" rx="1"/>
  <rect x="834" y="262" width="88" height="8" fill="#CFD8DC" rx="1"/>
  <rect x="834" y="275" width="80" height="8" fill="#CFD8DC" rx="1"/>
  <rect x="834" y="290" width="104" height="16" fill="#FFEBEE" stroke="#C62828"
        stroke-width="0.5" rx="2"/>
  <text x="886" y="301" text-anchor="middle" font-size="7.5" fill="#C62828">
    ？ request_id なし
  </text>

  <!-- ── データサービス ログボックス ── -->
  <rect x="964" y="224" width="116" height="92" fill="#FFFFFF" stroke="#546E7A"
        stroke-width="1" rx="3"/>
  <rect x="964" y="224" width="116" height="18" fill="#546E7A" rx="3"/>
  <text x="1022" y="237" text-anchor="middle" font-size="8.5" font-weight="bold"
        fill="#FFFFFF">データ ログ / Metrics</text>
  <rect x="970" y="249" width="104" height="8" fill="#CFD8DC" rx="1"/>
  <rect x="970" y="262" width="90" height="8" fill="#CFD8DC" rx="1"/>
  <rect x="970" y="275" width="96" height="8" fill="#CFD8DC" rx="1"/>
  <rect x="970" y="290" width="104" height="16" fill="#FFEBEE" stroke="#C62828"
        stroke-width="0.5" rx="2"/>
  <text x="1022" y="301" text-anchor="middle" font-size="7.5" fill="#C62828">
    ？ request_id なし
  </text>

  <!-- 相関なし "？" バッジ（ログボックス間ギャップ） -->
  <!-- API〜認証 ギャップ中央: x=(804+828)/2=816 -->
  <circle cx="816" cy="270" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="816" y="274" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#C62828">？</text>

  <!-- 認証〜データ ギャップ中央: x=(944+964)/2=954 -->
  <circle cx="954" cy="270" r="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="954" y="274" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#C62828">？</text>

  <!-- 相関なしラベル -->
  <text x="884" y="340" text-anchor="middle" font-size="9" fill="#546E7A">
    3サービスのログに相関なし ─ 同じリクエストの処理か不明
  </text>

  <!-- 問題ボックス -->
  <rect x="688" y="352" width="392" height="68" fill="#F5F7FA" stroke="#546E7A"
        stroke-width="1.5" rx="5"/>
  <text x="884" y="372" text-anchor="middle" font-size="10" fill="#546E7A">
    同じリクエストに対応するログを
  </text>
  <text x="884" y="390" text-anchor="middle" font-size="10" fill="#546E7A">
    3サービス間で特定・紐づけできない
  </text>
  <text x="884" y="410" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#D84315">情報はある ─ しかし流れが見えない</text>

  <!-- A-3 導線ボックス -->
  <rect x="688" y="434" width="392" height="40" fill="#DDEEFF" stroke="#2E75B6"
        stroke-width="1.5" rx="5"/>
  <text x="884" y="453" text-anchor="middle" font-size="10" fill="#2E75B6">
    → Observability（可観測性）で解決する
  </text>
  <text x="884" y="467" text-anchor="middle" font-size="10" font-weight="bold"
        fill="#2E75B6">（A-3 へ）</text>

  <!-- ═══════════════════════════════════════
       CAPTION / 図の説明
       y=652–730
  ═══════════════════════════════════════ -->
  <rect x="20" y="652" width="4" height="78" fill="#D84315" rx="2"/>
  <text x="34" y="668" text-anchor="start" font-size="11" fill="#1F4E79">
    <tspan font-weight="bold">情報と理解の違い：</tspan>
    <tspan>分散システムでは、各サービスがログとメトリクスを出力する。しかし、それぞれが独立して存在するだけでは</tspan>
  </text>
  <text x="34" y="688" text-anchor="start" font-size="11" fill="#1F4E79">
    一つのリクエストがどのサービスでいつ何をしたかを追えない。ログ間に相関情報（request_id など）がないためである。
  </text>
  <text x="34" y="708" text-anchor="start" font-size="11" fill="#1F4E79">
    <tspan font-weight="bold">情報が存在することと、システム全体を理解できることは別である。</tspan>
    <tspan>これが Observability（可観測性）の必要性を生む（→ A-3）。</tspan>
  </text>

</svg>
